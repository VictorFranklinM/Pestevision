seed: 42

data:
  raw_dir: "data/raw"
  manifest_path: "data/split/manifest_seed42.json"
  image_size: 224
  val_fraction: 0.2
  num_workers: 4
  batch_size: 32

training:
  optimizer: adam
  lr_patience: 10
  early_stopping_patience: 21
  max_epochs: 200

architectures:
  - alexnet
  - resnet50
  - efficientnet_b4
  - vit_b_16

augmentation_strategies:
  - no_da
  - da1
  - da2
  - da3

paths:
  # Each run writes best.pt / history.json / results.json to <results_dir>/<arch>__<strategy>/.
  # Test runs (--provider dummy or --epochs) go to outputs/scratch instead, never here.
  results_dir: "outputs/results"

# Paper Table 2 (best values found by the authors' grid search). We do not
# re-run the grid search; run_training.py reads these per architecture.
hyperparameters:
  alexnet:         {lr: 0.00001, batch_size: 128}
  resnet50:        {lr: 0.00001, batch_size: 16}
  efficientnet_b4: {lr: 0.0001,  batch_size: 16}
  vit_b_16:        {lr: 0.00001, batch_size: 32}
